<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #262626; /* Dark gray background */
      color: #e0e0e0; /* Light gray text */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .form-container {
      background-color: #333333; /* Slightly lighter dark gray for the form */
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      padding: 20px 30px;
      width: 100%;
      max-width: 400px;
    }

    .form-container h2 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 24px;
      color: #e0e0e0;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #555555; /* Subtle border for input fields */
      border-radius: 5px;
      background-color: #262626; /* Match the theme */
      color: #e0e0e0; /* Light gray text */
      font-size: 14px;
    }

    .form-group input:focus {
      outline: none;
      border-color: #ff8c00; /* Highlight border color */
      box-shadow: 0 0 4px #ff8c00;
    }

    .form-button {
      width: 100%;
      padding: 12px;
      background-color: #ff8c00; /* Orange accent for the button */
      border: none;
      border-radius: 5px;
      color: #262626; /* Dark text on the button for contrast */
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .form-button:hover {
      background-color: #ff6f00;
    }

    .form-footer {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .form-footer a {
      color: #ff8c00;
      text-decoration: none;
    }

    .form-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Register</h2>
    <form>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="form-button">Register</button>
    </form>
    <div class="form-footer">
      Already have an account? <a href="#">Log in</a>
    </div>
  </div>
</body>
</html>
